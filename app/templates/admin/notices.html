{% extends 'base.html' %}{% block title %}Avisos — Admin{% endblock %}{% block content %}<section class="page-head"><p class="eyebrow">ADMIN · AVISOS</p><h1>Avisos</h1></section><section class="panel"><form method="post"><label>Título<input name="title" required></label><label>Texto<textarea name="body" rows="6"></textarea></label><label class="check-line"><input type="checkbox" name="published" value="1" checked> Publicar agora</label><button class="btn btn-blue">Publicar aviso</button></form></section><hr><div class="notice-list">{% for item in notices %}<article class="panel notice-item"><div><h3>{{ item.title }}</h3><p>{{ item.body }}</p></div><form method="post" action="{{ url_for('admin.delete_notice', item_id=item.id) }}"><button class="btn btn-danger btn-small">Excluir</button></form></article>{% else %}<div class="panel empty">Nenhum aviso.</div>{% endfor %}</div>{% endblock %}
