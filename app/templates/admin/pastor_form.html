{% extends 'base.html' %}{% block title %}{{ 'Editar' if pastor else 'Novo' }} pastor — Admin{% endblock %}{% block content %}<section class="page-head"><p class="eyebrow">ADMIN · PASTORES</p><h1>{{ 'Editar pastor' if pastor else 'Adicionar pastor' }}</h1></section><section class="panel"><form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Nome<input name="name" value="{{ pastor.name if pastor else '' }}" required></label><label>Cargo<input name="role" value="{{ pastor.role if pastor else 'Pastor' }}"></label><label>Biografia<textarea name="bio" rows="10">{{ pastor.bio if pastor else '' }}</textarea></label><label>Foto<input type="file" name="photo" accept="image/png,image/jpeg,image/webp"></label><div class="row-actions"><button class="btn btn-blue">Salvar</button><a class="btn btn-ghost" href="{{ url_for('admin.pastors') }}">Cancelar</a></div></form></section>{% endblock %}
