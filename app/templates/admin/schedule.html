{% extends 'base.html' %}{% block title %}Cronograma — Admin{% endblock %}{% block content %}<section class="page-head"><p class="eyebrow">ADMIN · CRONOGRAMA</p><h1>Cronograma</h1></section><section class="panel"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Nome<input name="title" required placeholder="Culto de domingo"></label><label>Dia<input name="day" required placeholder="Domingo"></label><label>Horário<input name="time" placeholder="19:00"></label><label>Descrição<textarea name="description" rows="5"></textarea></label><label class="check-line"><input type="checkbox" name="published" value="1" checked> Publicar agora</label><button class="btn btn-blue">Adicionar</button></form></section><hr><div class="schedule-list">{% for item in items %}<article class="panel schedule-item"><div><h3>{{ item.title }}</h3><p><b>{{ item.day }}</b> · {{ item.time }}</p><p>{{ item.description }}</p></div><form method="post" action="{{ url_for('admin.delete_schedule', item_id=item.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-danger btn-small">Excluir</button></form></article>{% else %}<div class="panel empty">Nenhum item.</div>{% endfor %}</div>{% endblock %}
